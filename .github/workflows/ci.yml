name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: student_os_ci
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: student_os_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U student_os_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - uses: actions/checkout@v4
        with:
          repository: yujio2x/student-ai-bot
          ref: 98ad33fdf54ac0d5bf25af1cdca8c9931233f445
          path: .integration-bot
          persist-credentials: false
      - run: python -m pytest tests/test_postgres.py -q
        env:
          STUDENT_OS_TEST_DATABASE_URL: postgresql://student_os_ci:disposable_ci_only@localhost:5432/student_os_ci
          STUDENT_AI_BOT_ROOT: ${{ github.workspace }}/.integration-bot
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/pwa_runtime.cjs
      - run: node tests/account_runtime.cjs
      - run: node tests/theme_runtime.cjs
      - uses: actions/checkout@v4
        with:
          repository: yujio2x/student-ai-bot
          ref: 98ad33fdf54ac0d5bf25af1cdca8c9931233f445
          path: .integration-bot
          persist-credentials: false
      - run: python -m pytest tests -q
        env:
          STUDENT_AI_BOT_ROOT: ${{ github.workspace }}/.integration-bot
