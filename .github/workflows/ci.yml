name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/pwa_runtime.cjs
      - uses: actions/checkout@v4
        with:
          repository: yujio2x/student-ai-bot
          ref: f6e4552ec0b4790e2a0f54b94d171e71f1e7dcb7
          path: .integration-bot
          persist-credentials: false
      - run: python -m pytest tests -q
        env:
          STUDENT_AI_BOT_ROOT: ${{ github.workspace }}/.integration-bot
