<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student OS Admin</title><link rel="stylesheet" href="/static/styles.css?v=3"><link rel="stylesheet" href="/static/admin.css?v=3"><script src="/static/admin.js?v=3" defer></script></head>
<body><main class="admin-shell">
  <header class="admin-head"><div><p class="eyebrow">Admin-only</p><h1>Student OS Control Center</h1><p class="muted">Минимальные operational signals без расписаний, заданий и private notes.</p></div><a class="secondary admin-link" href="/">Вернуться в Student OS</a></header>
  <p id="adminError" class="form-error" role="alert"></p>
  <section><h2>Overview</h2><div id="overview" class="metric-grid"></div></section>
  <section class="card admin-card"><div class="section-head"><div><p class="eyebrow">Users</p><h2>Пользователи</h2></div><form id="userSearch" class="admin-search"><input id="userQuery" maxlength="120" placeholder="UUID, имя или Telegram"><button class="secondary">Найти</button></form></div><div id="users" class="admin-list"></div><div class="pager"><button id="prevUsers" class="secondary">Назад</button><span id="usersPage" class="muted"></span><button id="nextUsers" class="secondary">Дальше</button></div></section>
  <div class="admin-columns"><section class="card admin-card"><p class="eyebrow">Feedback</p><h2>Последние отзывы</h2><div id="feedback" class="admin-list"></div></section><section class="card admin-card"><p class="eyebrow">Audit</p><h2>Admin actions</h2><div id="actions" class="admin-list"></div></section></div>
</main>
<dialog id="adminUserDialog" class="modal"><div class="modal-card"><div class="modal-head"><div><p class="eyebrow">User detail</p><h2 id="adminUserTitle">Пользователь</h2></div><button class="icon-button" id="closeAdminUser" aria-label="Закрыть">×</button></div><div id="adminUserDetails"></div><form id="creditForm" class="admin-mutation"><h3>Изменить credits</h3><label>Delta<input id="creditDelta" type="number" min="-1000" max="1000" required></label><label>Причина<input id="creditReason" minlength="3" maxlength="500" required></label><button class="primary">Применить</button></form><form id="unlimitedForm" class="admin-mutation"><h3>Unlimited</h3><label class="deadline-status"><span>Безлимитный Student AI</span><input id="adminUnlimited" type="checkbox"></label><label>Причина<input id="unlimitedReason" minlength="3" maxlength="500" required></label><button class="primary">Сохранить</button></form><form id="trialForm" class="admin-mutation"><h3>Бесплатная попытка</h3><label>Причина восстановления<input id="trialReason" minlength="3" maxlength="500" required></label><button class="secondary">Восстановить попытку</button></form><p id="adminMutationError" class="form-error"></p></div></dialog>
</body></html>
